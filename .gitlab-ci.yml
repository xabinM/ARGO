stages:
  - build_backend
  - deploy_backend

variables:
  JAVA_VERSION: "17"

cache:
  paths:
    - ${BACKEND_DIR}/.gradle/wrapper
    - ${BACKEND_DIR}/.gradle/caches
  key: "$CI_COMMIT_REF_SLUG"
  policy: pull-push

build_backend_job:
  stage: build_backend
  image: openjdk:${JAVA_VERSION}-jdk-slim
  script:
    - cd ${BACKEND_DIR}
    - chmod +x gradlew
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - ${BACKEND_DIR}/build/libs/*.jar
    expire_in: 1 day
  only:
    - master
  tags:
    - master

deploy_backend_job:
  stage: deploy_backend
  image: ubuntu:latest
  before_script:
    - apt update && apt install -y openssh-client git --no-install-recommends
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_ci
    - chmod 600 ~/.ssh/id_rsa_ci
    - ssh-add ~/.ssh/id_rsa_ci
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - JAR_FILE=$(find ${BACKEND_DIR}/build/libs/ -name "*.jar" ! -name "*-plain.jar")
    - scp "$JAR_FILE" ${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/your-backend.jar
    - rm ~/.ssh/id_rsa_ci
    - ssh ${SERVER_USER}@${SERVER_HOST} "sudo systemctl restart your-backend.service"
  only:
    - master
  needs:
    - build_backend_job
  tags:
    - master