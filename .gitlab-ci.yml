stages:
  - build_backend
  - deploy_backend

variables:
  JAVA_VERSION: "17"
  JAR_PATH: "$BACKEND_DIR/build/libs"
  JAR_NAME: "your-backend.jar"

build_backend_job:
  stage: build_backend
  image: openjdk:$JAVA_VERSION-jdk-slim
  script:
    - cd "$BACKEND_DIR"
    - chmod +x gradlew
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - "$JAR_PATH/*.jar"
    expire_in: 1 day
  only:
    - master
  tags:
    - master

deploy_backend_job:
  stage: deploy_backend
  image: ubuntu:latest
  before_script:
    - apt update && apt install -y openssh-client --no-install-recommends
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_ci
    - chmod 600 ~/.ssh/id_rsa_ci
    - ssh-add ~/.ssh/id_rsa_ci
    - |
      echo "Host *" > ~/.ssh/config
      echo "    StrictHostKeyChecking no" >> ~/.ssh/config
      echo "    UserKnownHostsFile /dev/null" >> ~/.ssh/config
  script:
    - JAR_SOURCE_PATH=$(find "$JAR_PATH" -name "*.jar" ! -name "*-plain.jar" | head -n 1)
    - echo "Deploying $JAR_SOURCE_PATH to $SERVER_HOST:/home/$SERVER_USER/$JAR_NAME"
    - scp "$JAR_SOURCE_PATH" "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/$JAR_NAME"
    - |
      ssh -v -o ConnectTimeout=10 -o ServerAliveInterval=15 "$SERVER_USER@$SERVER_HOST" "\
        set -e; \
        echo 'Stopping existing application...'; \
        sudo pkill -f '$JAR_NAME' || echo 'No process found to kill.'; \
        sudo fuser -k 8080/tcp || echo 'No process using port 8080.'; \
        echo 'Starting new application...'; \
        nohup sudo java -jar /home/$SERVER_USER/$JAR_NAME \
          --spring.datasource.username=$DB_USERNAME \
          --spring.datasource.password=$DB_PASSWORD \
          --spring.datasource.url=\"$DB_URL\" \
          --spring.profiles.active=secret \
          > /home/$SERVER_USER/your-backend.log 2>&1 < /dev/null & \
        sleep 10; \
        echo 'Application started.' \
      " || { echo "SSH deployment failed"; exit 1; }
  after_script:
    - rm -f ~/.ssh/id_rsa_ci

  only:
    - master
  tags:
    - master

