# .gitlab-ci.yml

# 파이프라인의 스테이지 정의 (잡들의 실행 순서)
stages:
  - build_backend
  - deploy_backend
  - build_android

# 모든 잡에서 공통적으로 사용할 변수 (GitLab UI 변수 오버라이드 가능)
variables:
  BACKEND_DIR: "backend" # 백엔드 프로젝트 폴더 경로 (프로젝트 구조에 따라 변경)
  FRONTEND_DIR: "frontend" # 안드로이드 프로젝트 폴더 경로 (프로젝트 구조에 따라 변경)
  JAVA_VERSION: "17" # 백엔드 빌드에 사용할 Java 버전

# 캐싱 설정 (Gradle 및 fastlane 의존성 캐싱으로 빌드 시간 단축)
cache:
  paths:
    - ${BACKEND_DIR}/.gradle/wrapper
    - ${BACKEND_DIR}/.gradle/caches
    - ${FRONTEND_DIR}/.gradle/wrapper
    - ${FRONTEND_DIR}/.gradle/caches
    - ${FRONTEND_DIR}/vendor/bundle
  key: "$CI_COMMIT_REF_SLUG" # 브랜치별 캐시
  policy: pull-push

---

# --- 백엔드 CI/CD (Spring Boot) ---
build_backend_job:
  stage: build_backend
  image: openjdk:${JAVA_VERSION}-jdk-slim # 백엔드 빌드에 필요한 JDK 이미지
  script:
    - echo "🏗️ Building backend from ${BACKEND_DIR}..."
    - cd ${BACKEND_DIR}
    - chmod +x gradlew # gradlew 실행 권한 부여
    - ./gradlew clean build -x test # 테스트 제외하고 빌드
    - echo "✅ Backend build complete."
  artifacts: # 빌드된 JAR 파일을 다음 단계로 전달하기 위해 저장
    paths:
      - ${BACKEND_DIR}/build/libs/*.jar
    expire_in: 1 day
  only:
    - master # 'master' 브랜치에 푸시될 때만 실행 (프로젝트 기본 브랜치명 확인)
  tags:
    - master # 이 잡을 처리할 GitLab Runner의 태그 (러너 설정과 일치해야 함)

---

deploy_backend_job:
  stage: deploy_backend
  image: alpine/git # 배포에 필요한 SSH 클라이언트 포함 이미지
  before_script:
    - echo "🔑 Setting up SSH for deployment..."
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - # GitLab CI/CD 변수에서 SSH 키 불러오기
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts # 서버 호스트를 known_hosts에 추가
    - chmod 644 ~/.ssh/known_hosts
    - echo "✅ SSH setup complete."
  script:
    - echo "🚀 Deploying backend to ${SERVER_HOST}..."
    - JAR_FILE=$(find ${BACKEND_DIR}/build/libs/ -name "*.jar") # 빌드된 JAR 파일의 정확한 경로를 찾음
    - echo "Found JAR file: $JAR_FILE"
    - scp "$JAR_FILE" ${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/your-backend.jar # JAR 파일 서버로 복사
    - echo "🔄 Restarting backend service on ${SERVER_HOST}..."
    - ssh ${SERVER_USER}@${SERVER_HOST} "sudo systemctl restart your-backend.service" # SSH 통해 서비스 재시작
    - echo "🎉 Backend deployment complete."
  only:
    - master # 'master' 브랜치에 푸시될 때만 실행
  needs:
    - build_backend_job # build_backend_job이 성공해야 실행
  tags:
    - master # 이 잡을 처리할 GitLab Runner의 태그

---

# --- 안드로이드 앱 CI/CD ---
build_android_app_job:
  stage: build_android
  # 안드로이드 빌드에 필요한 Docker 이미지 (Ruby, Bundler, Android SDK 포함)
  image: circleci/android:api-33-node # 또는 다른 적절한 이미지 선택
  variables:
    ANDROID_SDK_ROOT: "/usr/local/android-sdk" # 선택한 이미지에 따른 SDK 경로 확인
  script:
    - echo "📱 Building Android app from ${FRONTEND_DIR}..."
    - cd ${FRONTEND_DIR}
    - bundle install --path vendor/bundle # fastlane 의존성 설치
    - echo "$ANDROID_KEYSTORE_FILE" | base64 -d > release-keystore.jks # 키스토어 파일 생성
    - bundle exec fastlane build_apk # fastlane 스크립트 실행
    - echo "✅ Android app build complete."
  artifacts:
    paths:
      - ${FRONTEND_DIR}/build/outputs/apk/release/*.apk
      - ${FRONTEND_DIR}/build/outputs/bundle/release/*.aab
    expire_in: 1 week
  only:
    - master # 'master' 브랜치에 푸시될 때만 실행
  tags:
    - master # 이 잡을 처리할 GitLab Runner의 태그