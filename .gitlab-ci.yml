stages:
  - build_backend
  - deploy_backend
  - deploy_ai

variables:
  JAVA_VERSION: "17"
  JAR_PATH: "$BACKEND_DIR/build/libs"
  JAR_NAME: "bogoargo-backend.jar"

build_backend_job:
  stage: build_backend
  image: openjdk:$JAVA_VERSION-jdk-slim
  script:
    - cd "$BACKEND_DIR"
    - chmod +x gradlew
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - "$JAR_PATH/*.jar"
    expire_in: 1 day
  only:
    - master
  tags:
    - master

deploy_backend_job:
  stage: deploy_backend
  image: ubuntu:latest
  before_script:
    - apt update && apt install -y openssh-client curl ca-certificates python3-venv --no-install-recommends
    - python3 -m venv ~/.venv/awscli
    - source ~/.venv/awscli/bin/activate
    - pip install awscli --upgrade
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_ci
    - chmod 600 ~/.ssh/id_rsa_ci
    - ssh-add ~/.ssh/id_rsa_ci
    - echo "Host *" > ~/.ssh/config
    - echo "    StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "    UserKnownHostsFile /dev/null" >> ~/.ssh/config
  script:
    - source ~/.venv/awscli/bin/activate
    - S3_UPLOAD_PATH="s3://$S3_BUCKET_NAME/backend/$JAR_NAME"
    - echo "Uploading $JAR_NAME to $S3_UPLOAD_PATH"
    - aws s3 cp "$JAR_PATH/$JAR_NAME" "$S3_UPLOAD_PATH"
    - echo "Deploying $JAR_NAME to $SERVER_HOST:/home/$SERVER_USER/$JAR_NAME"
    - scp "$JAR_PATH/$JAR_NAME" "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/$JAR_NAME"
    - ssh -T "$SERVER_USER@$SERVER_HOST" <<EOF
        set -e
        echo 'Stopping old process...'
        sudo pkill -f 'bogoargo-backend.jar' || echo 'No process found.'
        sudo fuser -k 8080/tcp || echo 'No process using 8080.'
        echo 'Starting new process...'
        sudo setsid nohup java -jar "/home/ubuntu/bogoargo-backend.jar" \
          --spring.datasource.username="${DB_USERNAME}" \
          --spring.datasource.password="${DB_PASSWORD}" \
          --spring.datasource.url="${DB_URL}" \
          --spring.profiles.active=secret \
          --spring.data.redis.host="${REDIS_HOST}" \
          --spring.data.redis.port="${REDIS_PORT}" \
          --jwt.secret="${JWT_SECRET}" \
          --jwt.accessTokenExpirationMs="${JWT_ACCESS_TOKEN_EXPIRATION_MS}" \
          --jwt.refreshTokenExpirationMs="${JWT_REFRESH_TOKEN_EXPIRATION_MS}" \
          > /tmp/bogoargo-backend.log 2>&1 < /dev/null &
        echo 'Launch command sent.'
      EOF
  only:
    - master
  tags:
    - master

deploy_ai_job:
  stage: deploy_ai
  image: ubuntu:latest
  before_script:
    - apt update && apt install -y openssh-client curl python3-venv --no-install-recommends
    - python3 -m venv ~/.venv/awscli
    - source ~/.venv/awscli/bin/activate
    - pip install awscli --upgrade
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_ci
    - chmod 600 ~/.ssh/id_rsa_ci
    - ssh-add ~/.ssh/id_rsa_ci
    - echo "Host *" > ~/.ssh/config
    - echo "    StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "    UserKnownHostsFile /dev/null" >> ~/.ssh/config
  script:
    - |
      cat > ./ai/.env << EOF
      GMS_API_KEY=$GMS_API_KEY
      GMS_BASE_URL=$GMS_BASE_URL
      OPENAI_API_KEY=$OPENAI_API_KEY
      ENVIRONMENT=production
      DEBUG=false
      EOF
    - scp -r ./ai "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/ai-service"
    - ssh -T "$SERVER_USER@$SERVER_HOST" <<EOF
        set -e
        cd /home/$SERVER_USER/ai-service
        sudo ufw allow 8000 || true
        docker-compose down || true
        echo "=== .env 파일 확인 ==="
        cat .env || echo ".env 파일 없음"
        GMS_API_KEY="$GMS_API_KEY" \
        GMS_BASE_URL="$GMS_BASE_URL" \
        OPENAI_API_KEY="$OPENAI_API_KEY" \
        docker-compose up -d --build
        echo "=== 서비스 시작 확인 (30초 대기) ==="
        sleep 30
        docker-compose ps
        curl -f http://localhost:8000/health || echo "건강성 체크 실패"
        echo "AI 서비스 배포 완료"
      EOF
  only:
    - master
  tags:
    - master