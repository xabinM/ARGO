spring:
  application:
    name: argo-backend

  config:
    import: optional:application-secret.yml   # 항상 불러오기

  profiles:
    active: local  # 필요하면 명시, 아니면 이 줄 빼도 됨

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    mvc:
      servlet:
        path: /

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.argo.backend: DEBUG