spring:
  profiles:
    include: secret

  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 개발 초기엔 create, update 사용 가능
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: 172.19.64.149
      port: 6379

