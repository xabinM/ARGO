spring:
  profiles:
    include: secret

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create   # 개발 초기엔 create, update 사용 가능
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: 172.19.64.149
      port: 6379

